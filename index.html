<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link rel="preload" as="image" href="img/water-can.png">
  <link rel="preload" as="image" href="img/rock.png">
  <link rel="preload" as="audio" href="sounds/pop.mp3">
  <link rel="preload" as="audio" href="sounds/thud.mp3">
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
  <div class="page-layout">
    <div class="container">
      <div class="brand-header">
        <img src="img/water-can-transparent.png" alt="charity: water logo">
        <span>charity: water</span>
      </div>
      <main>
        <h1>Water Quest</h1>
        <div class="score-progress" aria-label="Game progress">
          <div class="progress-track">
            <div id="progressbar" class="progress-fill"></div>
            <div class="milestone milestone-one" aria-label="First milestone">
              <span class="milestone-icon"><i class="bi bi-star-fill" aria-hidden="true"></i></span>
            </div>
            <div class="milestone milestone-two" aria-label="Second milestone">
              <span class="milestone-icon"><i class="bi bi-star-fill" aria-hidden="true"></i></span>
            </div>
            <div id="goal-marker" class="goal-marker" aria-label="Goal">
              <i class="bi bi-house-fill" aria-hidden="true"></i>
            </div>
          </div>
        </div>
        <p class="result-message" id="result-message"></p>
        <div class="stats">
          <p>Score: <span id="current-score">0</span></p>
          <p>Time Left: <span id="timer">60</span>s</p>
        </div>
        <div id="achievements" class="achievement"></div>
        <div class="game-grid"></div>
        <button id="start-game">Start Game</button>
      </main>
    </div>
    <aside class="sidebar">
      <h2>How to play</h2>
      <p>Collect the water cans before time runs out.</p>
      <div class="sidebar-section">
        <h3>Scoring</h3>
        <p><span class="score-icon water-can-icon" aria-hidden="true"></span> Water can <strong>+100</strong></p>
        <p><span class="score-icon rock-icon" aria-hidden="true"></span> Rock <strong>-200</strong></p>
      </div>
      <div class="sidebar-section">
        <h3>Goal</h3>
        <p>Reach <strong>5,000 points</strong> to win!</p>
      </div>
      <div class="sidebar-section">
        <label class="difficulty-label" for="difficulty">Difficulty</label>
        <select id="difficulty" class="difficulty-select">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </aside>
  </div>
  <script src="script.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
